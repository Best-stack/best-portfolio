name: Update About page

# Run manually from the Actions tab. Updates Experience and "Why me" on the About page.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check setup, write nothing)'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update About page
        run: npx tsx scripts/update-about.ts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
