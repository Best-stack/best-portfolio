name: Capture AAIF hero (sharp)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          mkdir -p /tmp/cap && cd /tmp/cap && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Record
        run: cp capture/aaif-hero-hq.mjs /tmp/cap/ && cd /tmp/cap && node aaif-hero-hq.mjs
      - name: Convert
        run: |
          cd /tmp/cap/out
          ffmpeg -nostdin -y -loglevel error -f concat -safe 0 -i list.txt -vf "fps=30,scale=2400:-2:flags=lanczos" -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -movflags +faststart -an hero-hq.mp4
          cp frames/00010.jpg still.jpg || true
          rm -rf frames list.txt
          ls -la
      - name: Save
        run: |
          cd /tmp/cap/out
          git init -q -b aaif-hero-capture
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "AAIF hero"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" aaif-hero-capture
