name: Capture Aeon site

# Run manually. Records the Aeon website (navigation, cards, quiz, steps), takes screenshots,
# downloads its videos, and saves everything on the "aeon-capture" branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          mkdir -p /tmp/cap && cd /tmp/cap && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Record and screenshot
        run: cp capture/aeon.mjs /tmp/cap/ && cd /tmp/cap && node aeon.mjs
      - name: Convert videos
        run: cd /tmp/cap && bash "$GITHUB_WORKSPACE/capture/aeon-post.sh"
      - name: Save to aeon-capture branch
        run: |
          cd /tmp/cap/out
          git init -q -b aeon-capture
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Aeon capture"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" aeon-capture
